[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 模组的必要配置
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi   ; 启用 8MB OPI PSRAM

; 走的是 CH343 转接芯片，自动检测容易失败，写死端口最稳
upload_port = COM6
monitor_port = COM6
upload_speed = 460800
monitor_speed = 115200
