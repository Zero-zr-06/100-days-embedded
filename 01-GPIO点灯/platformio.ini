; ESP32-S3 第一个工程：点亮板载灯
; 文档：https://docs.platformio.org/en/latest/boards/espressif32/esp32-s3-devkitc-1.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 用板子上的 USB 口直接打印串口（S3 默认是 USB CDC，不加这两行串口常常没输出）
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
upload_speed = 921600
